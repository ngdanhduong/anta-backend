version: '3.8'

services:
  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: anta-service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - anta-network

  yard-service-1:
    build:
      context: ./yard-service
      dockerfile: Dockerfile
    container_name: anta-yard-service-1
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - anta-network

  yard-service-2:
    build:
      context: ./yard-service
      dockerfile: Dockerfile
    container_name: anta-yard-service-2
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - anta-network

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: anta-booking-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
      - yard-service-1
      - yard-service-2
    networks:
      - anta-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: anta-payment-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - anta-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: anta-auth-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - anta-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: anta-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    depends_on:
      - service-registry
      - auth-service
      - booking-service
      - yard-service-1
      - payment-service
    networks:
      - anta-network

networks:
  anta-network:
    driver: bridge
