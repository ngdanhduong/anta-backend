# Cloud container blueprint for Anta Spring Boot API (no database required).
services:
  - type: web
    name: anta-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
